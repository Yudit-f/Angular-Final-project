<app-header></app-header>

<div class="trips-container">

  @for (trip of trips; track trip.id) {

    <div class="trip-card">

      <img
        [src]="trip.image"
        [alt]="trip.name">

      <h2>{{ trip.name }}</h2>

      <p>
        <strong>Destination:</strong>
        {{ trip.destination }}
      </p>
      <button (click)="showTripDetails(trip)"> More Info</button>
      @if (user.isAdmin === true &&  bookings.find((b) => b.tripId === trip.id)) {
      <button >עריכה</button>
      <button >מחיקה</button>
}

    </div>

  }
  

@if (user.isAdmin) {
    <button>הוספת טיול</button>
}


</div>
