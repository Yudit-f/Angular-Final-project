<app-header></app-header>

<div class="trips-container">

  @for (trip of trips; track trip.id) {

    <div class="trip-card">

      <img
        [src]="trip.image"
        [alt]="trip.name">

      <h2>{{ trip.name }}</h2>

      <p>
        <strong>Destination:</strong>
        {{ trip.destination }}
      </p>
      <button (click)="showTripDetails(trip)"> More Info</button>

    </div>

  }
    @if (user === 'admin') {
    <button>הוספת טיול</button>
}

@if (user.isAdmin === true ) {
    <button>הוספת טיול</button>
}

@if (user.isAdmin === true && canEditOrDelete(trips.tripId)) {
  <button >עריכה</button>
  <button >מחיקה</button>
}
</div>
