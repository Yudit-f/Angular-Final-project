<main class="auth-page">
  <section class="auth-panel">
    <div class="auth-copy">
      <p class="eyebrow">Welcome back</p>
      <h1>Sign in and keep planning your next escape.</h1>
    </div>

    <form #myForm="ngForm" (ngSubmit)="onSubmit(myForm)">
      <h2>Login</h2>

      <label>User Name</label>
      <input type="text" name="username" required ngModel>

      <label>Password</label>
      <input type="password" name="password" required ngModel>

      <button type="submit">Login</button>
      <p class="message">{{ message }}</p>
      <a routerLink="/register">Don't have an account? Register here</a>
    </form>
  </section>
</main>
