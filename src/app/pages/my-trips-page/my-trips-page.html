<app-header></app-header>
@if(myTrips.length === 0) {
    <p>You have no registered trips yet.</p>
}
@for (item of myTrips; track item.booking.id) {
<div class="trip-card">
    <img [src]="item.trip.image" [alt]="item.trip.name">

    <h2>{{ item.trip.name }}</h2>

    <p>
        <strong>Destination:</strong>
        {{ item.trip.destination }}
    </p>

    <p>
        <strong>People:</strong>
        {{ item.booking.people }}
    </p>
    <button (click)="showTripDetails(item.trip)"> More Info</button>

</div>
}
