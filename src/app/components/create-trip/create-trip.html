<app-header></app-header>

<main class="trip-form-page">
  <section class="form-intro">
    <p class="eyebrow">Admin</p>
    <h1>Create a new travel package.</h1>
  </section>

  <form #form="ngForm" (ngSubmit)="save(form)">
    <label for="name">Trip Name</label>
    <input id="name" type="text" name="name" [(ngModel)]="trip.name" placeholder="Santorini Escape" required>

    <label for="destination">Destination</label>
    <input id="destination" type="text" name="destination" [(ngModel)]="trip.destination" placeholder="Santorini, Greece" required>

    <div class="form-grid">
      <div>
        <label for="startDate">Start Date</label>
        <input id="startDate" type="date" name="startDate" [(ngModel)]="trip.startDate" required>
      </div>

      <div>
        <label for="endDate">End Date</label>
        <input id="endDate" type="date" name="endDate" [(ngModel)]="trip.endDate" required>
      </div>
    </div>

    <label for="price">Price</label>
    <input id="price" type="number" name="price" [(ngModel)]="trip.price" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" [(ngModel)]="trip.description" placeholder="Describe the highlights, itinerary, and experience."></textarea>

    <label for="image">Image URL</label>
    <input id="image" type="text" name="image" [(ngModel)]="trip.image" placeholder="https://...">

    <button type="submit">Create Trip</button>
  </form>
</main>
